name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and release
    if: github.repository == 'janiorvalle/hop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # GoReleaser creates the GitHub release
      id-token: write # build provenance attestation
      attestations: write # publish GitHub artifact attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make vet test release-check
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.11.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
